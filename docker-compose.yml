version: "3.8"
services:
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: grafana_agroptimum
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana_data:
