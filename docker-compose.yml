version: "3.8"
services:
  grafana:
    build:
      context: .          # raíz del repo donde están Dockerfile + conf + public
      dockerfile: Dockerfile
    container_name: grafana_agroptimum
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=sensoricapre.agroptimum.com
      - GF_SERVER_ROOT_URL=https://sensoricapre.agroptimum.com/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana_data:
