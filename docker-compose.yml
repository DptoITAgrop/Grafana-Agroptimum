version: "3.8"

services:
  grafana:
    build: .
    container_name: grafana_agroptimum
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # 👇 muy importante para reverse proxy
      - GF_SERVER_DOMAIN=sensoricapre.agroptimum.com
      - GF_SERVER_ROOT_URL=https://sensoricapre.agroptimum.com/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # (opcional) deja explícito el puerto http interno
      - GF_SERVER_HTTP_PORT=3000
    restart: unless-stopped

volumes:
  grafana_data:
